<main class="flex flex-col gap-5 mt-5">
  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center px-10 gap-3 md:gap-0">
    <h1 class="text-3xl font-bold text-gray-800">Local Storage Table</h1>
    <div class="flex gap-2">
      <button
        (click)="onAdd()"
        class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-5 rounded shadow transition"
      >
        Add
      </button>
      <button
        (click)="onClear()"
        class="cursor-pointer bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-5 rounded shadow transition"
      >
        Clear
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="px-4 md:px-10 overflow-x-auto">
    <table class="w-full table-fixed border border-gray-200 shadow-md rounded-lg overflow-hidden">
      <!-- Table Head -->
      <thead class="bg-gray-100 text-gray-700 uppercase text-sm">
        <tr>
          <th class="p-3 text-left">Key</th>
          <th class="p-3 text-left">Value</th>
          <th class="p-3 text-center">Actions</th>
        </tr>
      </thead>

      <!-- Search Row -->
      <tbody>
        <tr class="bg-gray-50 text-left">
          <td class="p-2"><app-search (query)="keyQuery.set($event)"></app-search></td>
          <td class="p-2"><app-search (query)="valueQuery.set($event)"></app-search></td>
          <td></td>
        </tr>

        <!-- Table Rows -->
        @for(st of localStorageItems() | filter: keyQuery(): valueQuery() ; track $index) {
        <tr class="text-gray-700 hover:bg-gray-100 border-b">
          <td appQueryHighlight [query]="keyQuery()" class="p-2 max-w-[150px] truncate" title="{{ st.key }}">{{ st.key }}</td>
          <td appQueryHighlight [query]="valueQuery()" class="p-2 max-w-[200px] truncate" title="{{ st.value }}">{{ st.value }}</td>
          <td class="flex gap-2 justify-center items-center p-2">
            <button
              (click)="onUpdate(st.key)"
              class="cursor-pointer bg-green-500 hover:bg-green-600 text-white font-medium py-1 px-3 rounded transition"
            >
              Update
            </button>
            <button
              (click)="onDelete(st.key)"
              class="cursor-pointer bg-red-500 hover:bg-red-600 text-white font-medium py-1 px-3 rounded transition"
            >
              Delete
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</main>
